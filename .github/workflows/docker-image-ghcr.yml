name: Publish Docker image (GHCR, native amd64 default)

on:
  push:
    branches:
      - main
      - sync/origin-main-with-local7-20260318
  workflow_dispatch:
    inputs:
      enable_arm64:
        description: Build arm64 image
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson((github.event_name == 'workflow_dispatch' && github.event.inputs.enable_arm64 == 'true') && '[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"},{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]' || '[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Normalize GHCR repository
        run: echo "GHCR_REPOSITORY=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Resolve publish tags
        run: |
          ref_name="${GITHUB_REF_NAME}"
          safe_ref="${ref_name//\//-}"
          primary_tag="${safe_ref}"
          latest_tag="latest-${safe_ref}"

          if [ "$ref_name" = "main" ]; then
            primary_tag="main"
            latest_tag="latest"
          elif [ "$ref_name" = "sync/origin-main-with-local7-20260318" ]; then
            primary_tag="origin-main-with-local7-20260318"
            latest_tag="latest-origin-main-with-local7-20260318"
          fi

          echo "PRIMARY_TAG=${primary_tag}" >> "$GITHUB_ENV"
          echo "LATEST_TAG=${latest_tag}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push single-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_REPOSITORY }}:${{ env.PRIMARY_TAG }}-${{ matrix.arch }}
            ghcr.io/${{ env.GHCR_REPOSITORY }}:${{ env.LATEST_TAG }}-${{ matrix.arch }}
            ghcr.io/${{ env.GHCR_REPOSITORY }}:sha-${{ env.SHORT_SHA }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  create_manifests:
    name: Create multi-arch manifests (GHCR)
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    steps:
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Normalize GHCR repository
        run: echo "GHCR_REPOSITORY=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Resolve publish tags
        run: |
          ref_name="${GITHUB_REF_NAME}"
          safe_ref="${ref_name//\//-}"
          primary_tag="${safe_ref}"
          latest_tag="latest-${safe_ref}"

          if [ "$ref_name" = "main" ]; then
            primary_tag="main"
            latest_tag="latest"
          elif [ "$ref_name" = "sync/origin-main-with-local7-20260318" ]; then
            primary_tag="origin-main-with-local7-20260318"
            latest_tag="latest-origin-main-with-local7-20260318"
          fi

          echo "PRIMARY_TAG=${primary_tag}" >> "$GITHUB_ENV"
          echo "LATEST_TAG=${latest_tag}" >> "$GITHUB_ENV"

      - name: Resolve ARM build switch
        run: |
          enable_arm64=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.enable_arm64 }}" = "true" ]; then
            enable_arm64=true
          fi
          echo "ENABLE_ARM64=${enable_arm64}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest (primary)
        run: |
          sources=("ghcr.io/${GHCR_REPOSITORY}:${PRIMARY_TAG}-amd64")
          if [ "${ENABLE_ARM64}" = "true" ]; then
            sources+=("ghcr.io/${GHCR_REPOSITORY}:${PRIMARY_TAG}-arm64")
          fi
          docker buildx imagetools create -t ghcr.io/${GHCR_REPOSITORY}:${PRIMARY_TAG} "${sources[@]}"

      - name: Create & push manifest (latest)
        run: |
          sources=("ghcr.io/${GHCR_REPOSITORY}:${LATEST_TAG}-amd64")
          if [ "${ENABLE_ARM64}" = "true" ]; then
            sources+=("ghcr.io/${GHCR_REPOSITORY}:${LATEST_TAG}-arm64")
          fi
          docker buildx imagetools create -t ghcr.io/${GHCR_REPOSITORY}:${LATEST_TAG} "${sources[@]}"

      - name: Create & push manifest (sha)
        run: |
          sources=("ghcr.io/${GHCR_REPOSITORY}:sha-${SHORT_SHA}-amd64")
          if [ "${ENABLE_ARM64}" = "true" ]; then
            sources+=("ghcr.io/${GHCR_REPOSITORY}:sha-${SHORT_SHA}-arm64")
          fi
          docker buildx imagetools create -t ghcr.io/${GHCR_REPOSITORY}:sha-${SHORT_SHA} "${sources[@]}"
